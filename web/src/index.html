<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>DollNews</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Täglich vier Beiträge aus wechselnden Wissensgebieten, ein Denkfehler und ein Quiz.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Vor dem ersten Rendern setzen, damit die Seite im Dunkelmodus nicht hell aufblitzt.
    document.documentElement.dataset.theme =
      localStorage.getItem('dollnews.theme') ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
