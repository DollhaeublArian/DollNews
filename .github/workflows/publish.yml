name: Seite veröffentlichen

# Die tägliche Ausgabe schreibt ein geplanter Claude-Agent nach generator/ANLEITUNG.md
# und pusht sie auf main. Dieser Workflow baut und veröffentlicht danach die Seite.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Seite bauen
        working-directory: web
        run: |
          npm ci
          npx ng build
          cp dist/web/browser/index.html dist/web/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/web/browser
      - id: deploy
        uses: actions/deploy-pages@v4
